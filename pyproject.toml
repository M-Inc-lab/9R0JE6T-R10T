[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reverse-forge"
version = "26.0.0"
description = "R3V3R53//F0RG3 - Self-Sufficient Cross-Platform Reverse Engineering & Vulnerability Research Suite"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-3.0-only"}
dependencies = [
    "pefile>=2023.2.7",
    "capstone>=5.0.0",
    "z3-solver>=4.12.0",
    "pyjwt>=2.8.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
colab = [
    "fastmcp>=0.4.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
]
symbolic = [
    "z3-solver>=4.12.0",
    "angr>=9.2.0",
]
dbi = [
    "frida>=16.0.0",
    "frida-tools>=12.0.0",
]
all = [
    "pefile>=2023.2.7",
    "capstone>=5.0.0",
    "z3-solver>=4.12.0",
    "fastmcp>=0.4.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "angr>=9.2.0",
    "frida>=16.0.0",
    "frida-tools>=12.0.0",
]

[project.scripts]
reverse-forge = "reverse_forge.cli:main"
reverse-forge-repl = "reverse_forge.repl:main"
reverse-forge-gui = "reverse_forge.gui_server:start_gui_workbench"
reverse-forge-app = "reverse_forge.desktop_app:main"
