name: R3V3R53//F0RG3 CI — Phase 4.1 Hardened Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

# ---------------------------------------------------------------------------
# Job 1: Rust & C native verification (independent from Python, fail-closed)
# ---------------------------------------------------------------------------
jobs:
  rust-and-c-native:
    name: "Rust & C Native Verification"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable (v1)
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cargo fmt check
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust_core/Cargo.toml --check

      - name: Cargo check (all targets)
        run: |
          set -euo pipefail
          cargo check --manifest-path rust_core/Cargo.toml --all-targets

      - name: Cargo clippy (deny warnings)
        run: |
          set -euo pipefail
          cargo clippy --manifest-path rust_core/Cargo.toml --all-targets -- -D warnings

      - name: Cargo test
        run: |
          set -euo pipefail
          cargo test --manifest-path rust_core/Cargo.toml -- --nocapture

      - name: C fallback bridge — compile and verify symbols
        run: |
          set -euo pipefail
          gcc -O3 -shared -fPIC -Wall -Wextra -Werror \
            -o /tmp/libreverse_forge_c.so rust_core/c_fallback_bridge.c -lm
          test -f /tmp/libreverse_forge_c.so
          nm -D /tmp/libreverse_forge_c.so | grep -E \
            "rf_rust_entropy|rf_rust_flirt_crc16|rf_rust_visor_exec|rf_native_backend_identity"

# ---------------------------------------------------------------------------
# Job 2: Clean Wheel Build & Package Isolation Verification (Outside Checkout)
# Builds a wheel and source distribution, verifies archive contents directly,
# and validates installation and imports from a clean directory outside the
# repository checkout with no PYTHONPATH workarounds.
# ---------------------------------------------------------------------------
  package-install:
    name: "Clean Wheel & Sdist Verification — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip and install build tools
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip "setuptools>=77.0" "packaging>=24.2" wheel build

      - name: Build wheel and sdist into isolated /tmp/rf_dist
        run: |
          set -euo pipefail
          rm -rf /tmp/rf_dist build reverse_forge.egg-info
          mkdir -p /tmp/rf_dist
          python -m build --wheel --sdist --outdir /tmp/rf_dist .
          ls -la /tmp/rf_dist

      - name: Verify wheel archive contents exclude rust_core, tests, and docs
        run: |
          set -euo pipefail
          python -c '
          import glob, zipfile
          wheels = glob.glob("/tmp/rf_dist/reverse_forge-*.whl")
          assert len(wheels) == 1, f"Expected exactly 1 wheel, found: {wheels}"
          with zipfile.ZipFile(wheels[0]) as zf:
              names = zf.namelist()
              top_dirs = {n.split("/")[0] for n in names if "/" in n}
              print("Wheel top-level entries:", sorted(top_dirs))
              assert "reverse_forge" in top_dirs, "reverse_forge missing from wheel"
              for forbidden in ("rust_core", "tests", "docs", ".github"):
                  assert forbidden not in top_dirs, f"Forbidden directory {forbidden!r} packaged in wheel"
          '

      - name: Install wheel and verify imports from clean directory outside checkout
        run: |
          set -euo pipefail
          unset PYTHONPATH
          python -m pip install --no-cache-dir /tmp/rf_dist/reverse_forge-*.whl
          mkdir -p /tmp/rf_clean_verify
          cd /tmp/rf_clean_verify
          python -c '
          import os, sys
          import reverse_forge
          from reverse_forge.authorization import CentralAuthorizationBoundary, ApprovalIssuer, HILKeyRing
          from reverse_forge.firebase_sync import FirebaseAuthManager, ProductionFirestoreStorageAdapter
          from reverse_forge.pipeline import PipelineStateMachine
          from reverse_forge.provenance import ScopeLedger

          pkg_path = os.path.abspath(reverse_forge.__file__)
          workspace = os.environ.get("GITHUB_WORKSPACE", "")
          print("Installed reverse_forge path:", pkg_path)
          if workspace:
              assert not pkg_path.startswith(os.path.abspath(workspace)), (
                  f"reverse_forge imported from checkout {workspace} instead of site-packages: {pkg_path}"
              )
          try:
              import rust_core
              raise SystemExit("FAIL: rust_core should not be importable outside checkout")
          except ModuleNotFoundError:
              print("PASS: Clean isolated wheel installation verified outside checkout")
          '

# ---------------------------------------------------------------------------
# Job 3: Security & Regression Test Matrix
# Requires both prior jobs to succeed before executing.
# ---------------------------------------------------------------------------
  python-security-and-regression:
    name: "Security & Regression — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    needs: [rust-and-c-native, package-install]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip "setuptools>=77.0" "packaging>=24.2" wheel
          python -m pip install "pefile>=2023.2.7" "capstone>=5.0.0" "z3-solver>=4.12.0" \
                                "pyjwt>=2.8.0" "cryptography>=41.0.0" pytest
          python -m pip install --no-cache-dir .

      - name: "[P0] Phase 4.1 & 4.2 Trust Boundary, HIL Bypass Closure & Entry-Point Suite"
        env:
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          pytest tests/test_phase4_auth_hardening.py tests/test_phase4_authorization_bypass.py tests/test_phase4_2_hil_bypass_closure.py -v --tb=short

      - name: "[P0] Authentication — Fail-Closed JWT, Role & Tenant Isolation Suite"
        env:
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          pytest tests/test_firebase_sync.py -v --tb=short

      - name: "[P0] Scope Ledger & HIL Authorization Regression"
        env:
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          pytest tests/test_security_regressions.py -v --tb=short

      - name: "[P1] Phase 3 E2E Trust Boundary Suite"
        env:
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          pytest tests/test_phase3_e2e_trust_boundary.py -v --tb=short

      - name: "[P1] Phase 4 End-to-End Acceptance Test"
        env:
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          pytest tests/test_phase4_e2e_acceptance.py -v --tb=short

      - name: "[P1] Differential Analysis Validation (Ground Truth)"
        env:
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          pytest tests/test_differential_analysis_validation.py -v --tb=short

      - name: "[P1] Native Backend ABI Integrity"
        env:
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          pytest tests/test_phase86_90_rust_native_core.py -v --tb=short

      - name: "[P1] Full Regression Test Suite"
        env:
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          pytest -v --tb=short

      - name: "[SMOKE] CLI Tool Availability Matrix"
        env:
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          python -m reverse_forge.cli detect-tools
          python -m reverse_forge.cli remediate --cwe CWE-120 --symbol parse_input
